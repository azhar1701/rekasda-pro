services:
  # =========================================================================
  # Development Service (Hot Reload via Volumes)
  # =========================================================================
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: rekasda-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env.local
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_USE_POLLING=true
      - WATCHPACK_POLLING=true
    networks:
      - rekasda-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # Production Service (Built image served by Nginx)
  # =========================================================================
  prod:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
        - VITE_GEMINI_API_KEY=${VITE_GEMINI_API_KEY}
    image: rekasda-pro:latest
    container_name: rekasda-prod
    ports:
      - "3000:80"
    restart: always
    networks:
      - rekasda-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  rekasda-net:
    driver: bridge
