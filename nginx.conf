# =============================================================================
# RekaSDA Pro — Nginx Configuration (SPA)
# =============================================================================
# Standar untuk React/Vite Single Page Application.
# - Listen port 80 (standar Nginx)
# - SPA fallback: try_files -> /index.html (mencegah 404 saat refresh rute)
# - Gzip compression untuk performa
# - Security headers
# - Static asset caching (1 tahun, immutable)
# =============================================================================

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # -----------------------------------------------------------------
    # Security Headers
    # -----------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # -----------------------------------------------------------------
    # Gzip Compression
    # -----------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # -----------------------------------------------------------------
    # SPA Routing — Fallback to index.html
    # -----------------------------------------------------------------
    # Ini adalah konfigurasi KRITIS untuk React/Vite SPA.
    # Tanpa ini, refresh di rute /modul-banjir akan menghasilkan 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -----------------------------------------------------------------
    # Static Assets — Aggressive Caching (Vite hashed filenames)
    # -----------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # -----------------------------------------------------------------
    # Error Handling
    # -----------------------------------------------------------------
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
