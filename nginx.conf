# =============================================================================
# RekaSDA Pro — Nginx Configuration (Enterprise Optimized)
# =============================================================================
# - Listen port 80 (standard Nginx)
# - SPA fallback: try_files -> /index.html
# - Gzip compression optimized for performance
# - Aggressive static asset caching with no-transform
# - Enhanced security headers
# =============================================================================

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # -----------------------------------------------------------------
    # Security Headers
    # -----------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' https: data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.googleapis.com;" always;

    # -----------------------------------------------------------------
    # Gzip Compression (Enterprise Level)
    # -----------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any; # Allow compression for all proxied requests
    gzip_comp_level 6; # Balanced CPU vs Compression Ratio
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        image/x-icon;
    gzip_disable "MSIE [1-6]\.";

    # -----------------------------------------------------------------
    # SPA Routing — Fallback to index.html
    # -----------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -----------------------------------------------------------------
    # Static Assets — Aggressive Caching
    # -----------------------------------------------------------------
    # Cache content with hashed filenames for 1 year
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, no-transform, immutable";
        access_log off;
    }

    # -----------------------------------------------------------------
    # Error Handling
    # -----------------------------------------------------------------
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
