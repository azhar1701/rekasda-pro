[build-system]
requires = ["hatchling"]
build-backend = "hatchling.backends"

[project]
name = "rekasda-engine"
version = "0.1.0"
description = "Python Hydrology Computation Engine - SNI Compliant"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "RekaSDA Pro Team" },
]

dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scipy>=1.12,<2",
    "pydantic>=2.5,<3",
    "loguru>=0.7.0",
    "sentry-sdk[fastapi]>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
