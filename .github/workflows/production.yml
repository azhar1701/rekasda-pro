# =============================================================================
# RekaSDA Pro — Production CI/CD Pipeline
# =============================================================================
# Trigger: Push ke branch main
# Job 1 (CI): Build Docker image & push ke Docker Hub
# Job 2 (CD): SSH ke VPS, pull image terbaru, restart service production
# =============================================================================

name: 🚀 Production Deploy

on:
  push:
    branches:
      - main

# Prevent concurrent deployments — cancel in-progress runs on same branch
concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# FASE 1: Continuous Integration — Build & Push Docker Image
# ---------------------------------------------------------------------------
jobs:
  build-and-push:
    name: 🏗️ Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Docker Buildx for advanced build features & layer caching
      - name: 🔧 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login to Docker Hub
      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Build and Push the production image
      #    Build args inject Supabase/Gemini credentials at build time
      #    (required because Vite bakes VITE_* vars into static assets)
      - name: 🐳 Build & Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/rekasda-pro:latest
            ${{ secrets.DOCKER_USERNAME }}/rekasda-pro:${{ github.sha }}
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # FASE 2: Continuous Deployment — SSH to VPS & Restart Service
  # ---------------------------------------------------------------------------
  deploy:
    name: 🚀 Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: 📡 SSH & Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "=========================================="
            echo "🚀 Starting RekaSDA Pro Production Deploy"
            echo "=========================================="

            # Navigate to application directory
            cd /opt/rekasda

            # Pull the latest image from Docker Hub
            echo "📥 Pulling latest Docker image..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/rekasda-pro:latest

            # Restart only the prod service (no downtime for other services)
            echo "♻️  Restarting production service..."
            export DOCKER_IMAGE=${{ secrets.DOCKER_USERNAME }}/rekasda-pro:latest
            docker compose -f docker-compose.prod.yml up -d --no-deps prod

            # Clean up dangling/unused images to save SSD space
            echo "🧹 Pruning unused Docker images..."
            docker image prune -f

            echo "=========================================="
            echo "✅ Deployment complete!"
            echo "=========================================="
