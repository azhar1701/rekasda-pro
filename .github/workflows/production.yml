# =============================================================================
# RekaSDA Pro — Production CI/CD Pipeline
# =============================================================================
# Trigger: Push ke branch main
# Job 1 (CI): Build Docker image & push ke Docker Hub
# Job 2 (CD): SSH ke VPS, pull image terbaru, restart service production
# =============================================================================

name: 🚀 Production Deploy

on:
  push:
    branches:
      - main

# Prevent concurrent deployments — cancel in-progress runs on same branch
concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# FASE 1: Continuous Integration — Build & Push Docker Image
# ---------------------------------------------------------------------------
jobs:
  # ---------------------------------------------------------------------------
  # FASE 1: Testing — Backend (Pytest) & Frontend (TSC)
  # ---------------------------------------------------------------------------
  test:
    name: 🧪 Automated Testing
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Backend Dependencies
        run: |
          cd backend
          pip install .[dev,api]

      - name: 🧪 Run Backend Tests
        run: |
          cd backend
          pytest tests/

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Frontend Dependencies
        run: npm install

      - name: 🛡️ Run Frontend Type Check
        run: npx tsc --noEmit

  # ---------------------------------------------------------------------------
  # FASE 2: Continuous Deployment — SSH to VPS & Restart Service
  # ---------------------------------------------------------------------------
  deploy:
    name: 🚀 Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 📡 SSH & Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "=========================================="
            echo "🚀 Starting RekaSDA Pro Production Deploy"
            echo "=========================================="

            # Navigate to application directory
            cd /opt/rekasda

            # Pull the latest code
            echo "📥 Fetching latest code from Git..."
            git pull origin main

            # Update Backend
            echo "🐍 Updating Python dependencies..."
            cd backend
            ./venv/bin/pip install .[api]
            
            # Restart Backend Service
            echo "♻️  Restarting RekaSDA FastAPI service..."
            sudo systemctl restart rekasda-fastapi

            # Update Frontend
            echo "⚛️  Building Frontend assets..."
            cd ..
            npm install
            npm run build

            # Deployment sync to web directory (assuming Nginx serves from /var/www/rekasda/dist)
            # echo "📂 Syncing assets to web root..."
            # sudo cp -r dist/* /var/www/rekasda/dist/

            echo "=========================================="
            echo "✅ Deployment complete!"
            echo "=========================================="
