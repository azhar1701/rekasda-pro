server {
    server_name api.rekasda.cloud; # Ganti dengan domain server backend Anda

    # Limitasi ukuran request body (penting jika Anda mengunggah file CSV/GeoJSON besar)
    client_max_body_size 50M;

    # Nginx akan meneruskan traffic dari Port 80/443 ke Uvicorn internal (Port 8000)
    location / {
        proxy_pass http://127.0.0.1:8000; # Target Uvicorn / Gunicorn
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings untuk proses kalkulasi hidrologi yang mungkin memakan waktu
        proxy_connect_timeout 120;
        proxy_send_timeout 120;
        proxy_read_timeout 120;
        send_timeout 120;
    }

    # SSL Certbot Configuration (Let's Encrypt)
    # Jalankan perintah: sudo certbot --nginx -d api.rekasda.cloud
    # Blok di bawah akan ditambahkan otomatis oleh Certbot setelah script di atas dijalankan

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.rekasda.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.rekasda.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = api.rekasda.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name api.rekasda.cloud;
    return 404; # managed by Certbot
}
